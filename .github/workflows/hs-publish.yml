name: HS Publish to git maven

# Builds all SDK artifacts (Rust + Kotlin, Slipstream enabled) from the current
# ref and publishes them to the `maven` branch of this fork, which is consumed as
#   maven { url = uri("https://raw.githubusercontent.com/horizontalsystems/zodl-android-wallet-sdk/maven/") }
#
# Toolchain setup is done here rather than through .github/actions/setup: that
# composite action warms the whole SDK (demo-app included) on every cache miss and
# its cache-save steps reference outputs that do not exist, so nothing it restores
# ever hits. The steps below mirror its JDK/NDK/Rust installation exactly.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 3.1.1-hs.1)"
        required: true
        type: string
      publish:
        description: "Push the artifacts to the maven branch (disable for a build-only run)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android NDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          echo "y" | "$SDKMANAGER" "ndk;$(sed -n 's/^ANDROID_NDK_VERSION=//p' gradle.properties)"

      - name: Set up Rust
        run: |
          CHANNEL="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "${CHANNEL}"
          rustup default "${CHANNEL}"
          rustup target add --toolchain "${CHANNEL}" armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android

      - name: Rust cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          # Public content only: crates.io registry and compiled output (no ~/.cargo/git)
          path: |
            backend-lib/target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: ${{ runner.os }}-hs-rust-${{ hashFiles('backend-lib/Cargo.lock', 'backend-lib/Cargo.toml', 'backend-lib/build.rs', 'rust-toolchain.toml', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-hs-rust-

      - name: Build and publish to local maven
        timeout-minutes: 150
        env:
          ORG_GRADLE_PROJECT_LIBRARY_VERSION: ${{ inputs.version }}
          ORG_GRADLE_PROJECT_IS_SNAPSHOT: "false"
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Checkout maven branch
        if: ${{ inputs.publish }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: maven
          path: maven-repo

      - name: Copy artifacts into maven branch
        if: ${{ inputs.publish }}
        run: |
          mkdir -p maven-repo/com
          cp -R "$HOME/.m2/repository/com/zodl" maven-repo/com/
          cd maven-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add com
          git commit -m "Publish ${{ inputs.version }} from ${GITHUB_SHA}"
          git push origin maven

      - name: Upload artifacts as run backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maven-artifacts-${{ inputs.version }}
          path: ~/.m2/repository/com/zodl
          retention-days: 30
